services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: elineas
      POSTGRES_PASSWORD: elineas
      POSTGRES_DB: elineas_auth
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elineas -d elineas_auth"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379" # expuesto para correr la API en el host (bun run dev)
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
  # Servidor SMTP falso para desarrollo: captura los correos salientes y los
  # muestra en una UI web en lugar de entregarlos. En producción no existe
  # (allí se usa Resend vía HTTP con RESEND_API_KEY).
  maildev:
    image: maildev/maildev
    restart: unless-stopped
    ports:
      # La UI escucha en 1080 dentro del contenedor, pero se publica en 9825:
      # en Windows/WSL2 Hyper-V reserva rangos de puertos dinámicos (varían en
      # cada reinicio) y suelen chocar con 1080/8025/1025; 9825/9826 caen
      # fuera de esos rangos.
      - "9825:1080" # UI web (http://localhost:9825)
      - "9826:1025" # SMTP, expuesto para correr la API en el host (bun run dev)

  api:
    build:
      context: .
      target: dev
    image: elineas-auth-api:1.2.0
    container_name: elineas-auth-api
    restart: unless-stopped
    ports:
      - "8081:8081"
    env_file:
      - .env.local
    environment:
      APP_ENV: local
      DATABASE_URL: postgres://elineas:elineas@postgres:5432/elineas_auth
      REDIS_URL: redis://redis:6379
      SMTP_HOST: maildev
      SMTP_PORT: 1025
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
