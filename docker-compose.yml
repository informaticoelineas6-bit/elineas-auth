# Stack de desarrollo completo: base de datos, redis, SMTP falso, la API y el
# panel. Un solo `docker compose up` levanta todo.
#
# Antes eran dos compose en dos repos: el del panel se enganchaba a
# `elineas-auth_default`, una red EXTERNA que solo existía si el compose de la
# API se había levantado primero (y con ese nombre exacto). Al vivir los dos
# servicios en el mismo archivo, la red la gestiona compose y ese acoplamiento
# desaparece.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: elineas
      POSTGRES_PASSWORD: elineas
      POSTGRES_DB: elineas_auth
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elineas -d elineas_auth"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379" # expuesto para correr la API en el host (bun run dev:backend)
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Servidor SMTP falso para desarrollo: captura los correos salientes y los
  # muestra en una UI web en lugar de entregarlos. En producción no existe
  # (allí se usa Resend vía HTTP con RESEND_API_KEY).
  maildev:
    image: maildev/maildev
    restart: unless-stopped
    ports:
      # La UI escucha en 1080 dentro del contenedor, pero se publica en 9825:
      # en Windows/WSL2 Hyper-V reserva rangos de puertos dinámicos (varían en
      # cada reinicio) y suelen chocar con 1080/8025/1025; 9825/9826 caen
      # fuera de esos rangos.
      - "9825:1080" # UI web (http://localhost:9825)
      - "9826:1025" # SMTP, expuesto para correr la API en el host

  backend:
    build:
      # Contexto = raíz del monorepo: ahí están el lockfile y los workspaces.
      context: .
      dockerfile: apps/backend/Dockerfile
      target: dev
    image: elineas-auth-backend:2.3.0
    container_name: elineas-auth-backend
    restart: unless-stopped
    ports:
      - "8081:8081"
    env_file:
      - apps/backend/.env.local
    environment:
      APP_ENV: local
      DATABASE_URL: postgres://elineas:elineas@postgres:5432/elineas_auth
      REDIS_URL: redis://redis:6379
      SMTP_HOST: maildev
      SMTP_PORT: 1025
    volumes:
      # Se montan los tres workspaces que la API compila, y se preservan los
      # node_modules de la imagen (los del host son de otra plataforma y, con
      # workspaces, viven tanto en la raíz como en cada app).
      - ./apps/backend:/app/apps/backend
      - ./packages/auth-contracts:/app/packages/auth-contracts
      - /app/node_modules
      - /app/apps/backend/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: dev
    image: elineas-auth-frontend:3.2.1
    container_name: elineas-auth-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - apps/frontend/.env
    environment:
      NODE_ENV: development
      # Dentro de la red de compose "localhost" es este propio contenedor, no
      # el de la API: hay que dirigirse a ella por el nombre del servicio.
      AUTH_API_URL: http://backend:8081
    volumes:
      - ./apps/frontend:/app/apps/frontend
      - ./apps/backend:/app/apps/backend
      - ./packages/auth-contracts:/app/packages/auth-contracts
      - /app/node_modules
      - /app/apps/frontend/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
