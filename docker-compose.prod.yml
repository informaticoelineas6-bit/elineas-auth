services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--save",
        "60",
        "1",
        "--requirepass",
        "${REDIS_PASSWORD}",
      ]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    networks:
      - elineas-auth-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      target: prod
    image: elineas-auth-api:1.0.0
    container_name: elineas-auth-api
    restart: unless-stopped
    ports:
      - "3001:8080"
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://elineasadmin:wn%29%3F%5E4L_4tG%26%3DWAp@host.docker.internal:5432/ELINEAS_BD
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    extra_hosts:
      # host.docker.internal no resuelve por defecto en Linux (a diferencia de
      # Docker Desktop en Mac/Windows); host-gateway lo mapea a la IP del host.
      - "host.docker.internal:host-gateway"
    networks:
      - elineas-auth-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://localhost:8080/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redisdata:

networks:
  elineas-auth-net:
    external: true
