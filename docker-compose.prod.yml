services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--save",
        "60",
        "1",
        "--requirepass",
        "${REDIS_PASSWORD}",
      ]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    networks:
      - elineas-auth-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      target: prod
    image: elineas-auth-api:1.2.0
    container_name: elineas-auth-api
    restart: unless-stopped
    ports:
      - "3001:8080"
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      # DATABASE_URL viene de `.env.production` (fuera de git): antes estaba
      # aquí en claro con la contraseña del superusuario. Debe apuntar al
      # contenedor de la BD POR NOMBRE sobre `elineas-db`, no por
      # `host.docker.internal`:
      #   DATABASE_URL=postgres://USUARIO:PASS@ELINEAS_BD:5432/ELINEAS_BD
      # Por `host.docker.internal` el paquete sale al gateway del host y se
      # NATea, así que Postgres lo ve con una IP origen que no cae en
      # 10.0.5.0/24 — la única subred que su `pg_hba.conf` acepta.
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    networks:
      - elineas-auth-net
      - elineas-db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://localhost:8080/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redisdata:

networks:
  # Red propia de este stack: api ↔ redis.
  elineas-auth-net:
    external: true
  # Único camino permitido hacia ELINEAS_BD: la red del proyecto `elineas`, con
  # subred 10.0.5.0/24 — la que acepta su `pg_hba.conf`
  # (`host all all 10.0.5.0/24 scram-sha-256`). No la crea este compose; la crea
  # el del proyecto `elineas`, que la declara con `ipam` explícito para que un
  # `down`/`up` no le reasigne otra subred del pool y deje fuera a todos los
  # clientes a la vez. Aquí solo se consume.
  elineas-db:
    name: elineas_default
    external: true
